name: Build APK and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shashti-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shashti-tv-apk
          path: shashti-tv.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sajo TV
          body: "حمّل shashti-tv.apk وثبّته على الـTV box."
          files: shashti-tv.apk
          make_latest: true

  beta:
    # Sajo Beta (GeckoView + uBlock Origin): paused — the experiment is closed (the code stays)
    if: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Put the real uBlock Origin (Firefox build) inside the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/gorhill/uBlock/releases/latest --jq '.assets[] | select(.name | test("firefox.*xpi$")) | .browser_download_url' | head -1)
          echo "uBlock: $url"
          curl -sL "$url" -o ubo.xpi
          mkdir -p android/beta/src/main/assets/ubo
          unzip -q -o ubo.xpi -d android/beta/src/main/assets/ubo
          ls android/beta/src/main/assets/ubo | head
      - name: Build Sajo Beta
        working-directory: android
        run: gradle :beta:assembleRelease --no-daemon
      - name: Rename
        run: cp android/beta/build/outputs/apk/release/beta-release.apk sajo-beta.apk
      - name: Publish to the "beta" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Sajo Beta
          body: "تجربة: محرّك فايرفوكس + uBlock Origin. حمّل sajo-beta.apk وثبّته على الموبايل."
          files: sajo-beta.apk
          prerelease: true
          make_latest: false

  pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publish version number for in-app updates
        run: |
          code=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          echo "{\"code\": $code, \"name\": \"$code\"}" > web/version.json
          cat web/version.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Wait for artifact
        run: sleep 15
      - id: deploy
        uses: actions/deploy-pages@v4
