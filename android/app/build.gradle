plugins { id 'com.android.application' }

android {
    namespace 'com.shashti.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.shashti.tv'
        minSdk 21
        targetSdk 34
        versionCode 131
        versionName '131'
    }
    signingConfigs {
        shashti {
            storeFile file('shashti.keystore')
            storePassword 'shashti123'
            keyAlias 'shashti'
            keyPassword 'shashti123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.shashti }
        debug { signingConfig signingConfigs.shashti }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'com.google.android.gms:play-services-cast-framework:22.1.0'
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
}

// copy the web app into the APK assets before every build
tasks.register('copyWeb', Copy) {
    from "${rootDir}/../web"
    include 'index.html', 'icon-192.png'
    into "${projectDir}/src/main/assets"
}
preBuild.dependsOn copyWeb
