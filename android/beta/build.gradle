plugins { id 'com.android.application' }

// Sajo Beta: the same app idea on Firefox's engine (GeckoView) with the real uBlock Origin — a separate test app
android {
    namespace 'com.shashti.beta'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shashti.beta'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName 'beta1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        shashti {
            storeFile file('../app/shashti.keystore')
            storePassword 'shashti123'
            keyAlias 'shashti'
            keyPassword 'shashti123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.shashti }
        debug { signingConfig signingConfigs.shashti }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:133.0.20241209150345'
}
