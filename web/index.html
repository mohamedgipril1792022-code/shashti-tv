<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sajo TV</title>
<meta name="theme-color" content="#160e10">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d0e;--panel:#1d1416;--line:#3a2124;--red:#e50914;--txt:#fff;--mut:#b9a9ab}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Cairo,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px clamp(12px,3vw,40px);background:linear-gradient(#241316,#160e10);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:clamp(22px,2.6vw,40px);flex:1;white-space:nowrap}
.logo b{color:var(--red)}
.hbtn{background:#2a1a1d;color:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;font:700 clamp(14px,1.4vw,22px) Cairo,sans-serif;cursor:pointer;white-space:nowrap}
.hbtn.red{background:var(--red);border-color:var(--red)}
.hbtn.on{background:#fff;color:#000}
.search{display:flex;gap:8px;padding:10px clamp(12px,3vw,40px) 0}
.search input{flex:1;min-width:0;background:#0f0a0b;color:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font:16px Cairo,sans-serif}
.search a{text-decoration:none;display:flex;align-items:center}
.search a[hidden]{display:none}
.fav{position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.25);color:#ffd54a;border-radius:12px;width:clamp(30px,2.6vw,44px);height:clamp(30px,2.6vw,44px);font-size:clamp(16px,1.6vw,26px);cursor:pointer;line-height:1}
.fav:focus-visible,.fav:hover{background:var(--red);outline:none}
.editing .fav{display:none}
body.kids #addSite,body.kids #addCont,body.kids #addRm,body.kids #editBtn{display:none}
body.kids footer{display:none}
body.kids #chips{display:none}
#push{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px}
#push.open{display:flex}
#push .box{text-align:center}
#push .big{display:block;text-decoration:none;font-size:clamp(20px,2.4vw,36px);padding:16px;margin-top:14px}
#status{font-size:13px;color:var(--mut);padding:6px clamp(12px,3vw,40px) 0;min-height:4px}
main{padding:0 clamp(12px,3vw,40px)}
h2{font-size:clamp(18px,2vw,32px);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 small{font-size:.55em;color:var(--mut);font-weight:400}
.row{display:flex;gap:clamp(10px,1.4vw,22px);overflow-x:auto;padding:6px 4px 12px;scroll-snap-type:x proximity}
.row .tile{flex:0 0 clamp(100px,11vw,180px);scroll-snap-align:start}
.mcard{position:relative;flex:0 0 clamp(170px,20vw,300px);scroll-snap-align:start;display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--txt)}
.mcard:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.mcard .mlg{font-size:clamp(10px,.8vw,12px);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mteams{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 4px}
.mcard .mteams img{width:clamp(26px,2.2vw,36px);height:clamp(26px,2.2vw,36px);object-fit:contain}
.mcard .msc{font-weight:900;font-size:clamp(14px,1.3vw,21px);white-space:nowrap}
.mcard .mvs{font-size:clamp(11px,.9vw,14px);font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mst{margin-top:6px;text-align:center;font-size:clamp(10px,.85vw,13px);color:var(--mut)}
.mcard .mst b.live{color:#fff;background:var(--red);border-radius:8px;padding:1px 10px;font-weight:900}

.row.wide .tile{flex-basis:clamp(140px,19vw,280px);width:clamp(140px,19vw,280px);aspect-ratio:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(100px,10vw,185px),1fr));gap:clamp(10px,1.2vw,20px);padding:6px 4px}
/* continue watching: picture on top, small text below it */
.tile.capt{min-width:0;max-width:100%;aspect-ratio:auto;overflow:visible;background:none;border-radius:0;transform:none!important;box-shadow:none!important}
.tile.capt .thumb{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#222;transition:transform .15s,box-shadow .15s}
.tile.capt:focus-visible .thumb,.tile.capt:hover .thumb{transform:scale(1.04);box-shadow:0 0 0 3px var(--red),0 8px 22px rgba(0,0,0,.55)}
.tile.capt .ago{font-size:clamp(10px,.85vw,13px);padding:0 7px}
.cap{padding:6px 3px 0;text-align:right;min-width:0;width:100%}
.cap b{color:var(--txt);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:clamp(12px,1.05vw,16px);font-weight:700;line-height:1.3;white-space:normal;overflow:hidden;word-break:break-word}
.cap span{display:block;font-size:clamp(10px,.85vw,13px);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editing .tile.capt::after{top:6px}
.tile.sq .thumb{aspect-ratio:1;border-radius:20px}
.phone .tile.sq .thumb{border-radius:14px}
.tile.sq .cap b{-webkit-line-clamp:2}
.tile.sq .cap{text-align:center}
.warn{position:absolute;top:6px;left:6px;z-index:2;background:#ffb300;color:#111;border:none;border-radius:12px;min-width:30px;height:30px;padding:0 8px;font-size:16px;font-weight:900;cursor:pointer;line-height:1}
.warn:hover,.warn:focus-visible{background:var(--red);color:#fff;outline:none}
.editing .warn{display:none}
#cine{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;filter:blur(38px) brightness(.45) saturate(1.2);transform:scale(1.25);opacity:0;transition:opacity .6s;pointer-events:none}
#cine.on{opacity:1}
html.light #cine{filter:blur(38px) brightness(1.05) saturate(1.1)}
html.light #cine.on{opacity:.35}
.search .hbtn{white-space:nowrap}
.tile.capt.moving{outline:none}
.tile.capt.moving .thumb{outline:5px dashed #ffd54a;outline-offset:-5px;transform:scale(1.07);box-shadow:0 0 0 6px rgba(255,213,74,.35)}
.done{position:absolute;bottom:10px;right:6px;z-index:2;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.25);color:#7cfc9a;border-radius:12px;min-width:30px;height:30px;padding:0 8px;font-size:16px;font-weight:700;cursor:pointer;line-height:1}
.done:hover,.done:focus-visible{background:var(--red);color:#fff;outline:none}
.editing .done{display:none}
.newb{position:absolute;top:8px;left:8px;z-index:2;background:var(--red);color:#fff;border-radius:10px;padding:1px 9px;font-size:clamp(10px,.9vw,14px);font-weight:900}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 8px}
#chips .hbtn{font-size:clamp(13px,1.2vw,18px);padding:6px 14px}
.tile{position:relative;display:block;aspect-ratio:1;border-radius:20px;overflow:hidden;text-decoration:none;color:#fff;background:#222;outline:none;transition:transform .15s,box-shadow .15s;cursor:pointer}
.tile.moving{outline:5px dashed #ffd54a;outline-offset:-5px;transform:scale(1.07);box-shadow:0 0 0 6px rgba(255,213,74,.35),0 12px 30px rgba(0,0,0,.6);z-index:3}
#moveBar{position:fixed;left:50%;bottom:24px;text-align:center;max-width:94vw;transform:translateX(-50%);background:#ffd54a;color:#111;font-weight:900;padding:12px 22px;border-radius:14px;z-index:50;font-size:clamp(16px,1.5vw,24px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tile .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.tile .shade{position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.55))}
.tile .name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:900;font-size:clamp(15px,1.7vw,28px);line-height:1.15;text-shadow:0 3px 10px rgba(0,0,0,.85),0 0 2px #000;word-break:break-word}
.tile .pbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.25)}.tile .pbar i{display:block;height:100%;background:var(--red)}
.tile .sub{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:rgba(0,0,0,.65);font-size:clamp(12px,1.2vw,20px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ago{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border-radius:10px;padding:1px 8px;font-size:clamp(11px,1vw,17px)}
.tile:focus-visible,.tile:hover{transform:scale(1.05);box-shadow:0 0 0 4px var(--red),0 10px 30px rgba(0,0,0,.6)}
.upd{position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:3px 9px;font:700 clamp(12px,1.1vw,18px) Cairo,sans-serif;cursor:pointer}
.upd:focus-visible,.upd:hover{background:var(--red);outline:none}
.editing .upd{display:none}
.editing .tile::after{content:"✎ تعديل";position:absolute;top:8px;left:8px;background:var(--red);border-radius:10px;padding:2px 10px;font-size:14px;font-weight:700}
.empty{color:var(--mut);padding:14px 4px;font-size:clamp(14px,1.3vw,20px)}
.hbtn:focus-visible,.fbtn:focus-visible,input:focus,select:focus{outline:3px solid var(--red);outline-offset:2px}
footer{text-align:center;margin-top:30px}
#ver{background:none;border:none;color:var(--mut);font:13px Cairo,sans-serif;cursor:pointer;padding:6px 10px}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
.box h3{margin:0 0 14px;font-size:clamp(18px,1.8vw,28px)}
.box label{display:block;font-weight:700;margin:12px 0 4px;font-size:clamp(14px,1.3vw,20px)}
.box input,.box select{width:100%;background:#0f0a0b;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:16px Cairo,sans-serif}
.box input[dir=ltr]{text-align:left}
.prev{display:flex;gap:12px;align-items:center;margin-top:6px}
.prev .tile{width:110px;flex:0 0 110px}
.prev .tile .name{font-size:18px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.fbtn{flex:1;min-width:110px;background:#2a1a1d;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font:700 16px Cairo,sans-serif;cursor:pointer}
.fbtn.red{background:var(--red);border-color:var(--red)}
.fbtn.g{display:block;text-align:center;text-decoration:none;background:#fff;color:#1a1a1a;margin-top:6px}
.steps{color:var(--mut);font-size:13px;margin:8px 0 0;padding-inline-start:18px}
.fbtn.del{background:transparent;color:#ff6b6b;border-color:#6b2a2a}
.hint{color:var(--mut);font-size:13px;margin-top:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border-radius:14px;padding:8px 16px;font-weight:700;display:none;z-index:30}
/* the built-in player: direct stream addresses (m3u8/mp4…) play over the launcher, Back closes it */
#ply{position:fixed;inset:0;z-index:24;background:#000;display:flex;flex-direction:column}
#ply .pbar{display:flex;align-items:center;gap:10px;padding:8px clamp(12px,3vw,40px);background:#160e10;border-bottom:1px solid var(--line)}
#ply .pbar span{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ply video{flex:1;width:100%;min-height:0;background:#000}
/* light theme */
html.light{--bg:#f6f1f1;--panel:#fff;--line:#d9cccd;--txt:#1b1213;--mut:#6d5b5e}
html.light header{background:linear-gradient(#fff,#f1e8e8)}
html.light .hbtn{background:#fff;color:#1b1213}
html.light .hbtn.on{background:#1b1213;color:#fff}
html.light .hbtn.red{background:var(--red);border-color:var(--red);color:#fff}
html.light .search input,html.light .box input,html.light .box select{background:#fff;color:#1b1213}
html.light .fbtn{background:#f1e8e8;color:#1b1213}
html.light .fbtn.red{background:var(--red);border-color:var(--red);color:#fff}
html.light .fbtn.g{background:#1b1213;color:#fff}
html.light .fbtn.del{background:transparent;color:#d33}
/* phone (the app on a phone): three tiles a row, finger-sized */
.phone .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.phone .row .tile{flex-basis:100px}
.phone .row.wide .tile{flex-basis:150px;width:150px}
.phone .tile{border-radius:14px}
.phone .tile .name{font-size:14px;padding:6px}
.phone .tile .sub{font-size:11px}
.phone .fav{width:30px;height:30px;font-size:16px;top:5px;right:5px}
@media (max-width:520px){.hbtn .t{display:none}.hbtn{padding:8px 11px}}
/* trending rows: posters that drift by themselves */
.row.tr{scroll-snap-type:none;scrollbar-width:none}
.row.tr::-webkit-scrollbar{display:none}
.row.tr .tile{flex:0 0 clamp(105px,10vw,165px);scroll-snap-align:none}
.tile.capt.pst .thumb{aspect-ratio:2/3}
.phone .row.tr .tile{flex-basis:105px}
/* ---------- polish: glow, depth and motion that stay cheap on the box ---------- */
body{background:radial-gradient(1100px 480px at 85% -6%,rgba(229,9,20,.08),transparent 60%),radial-gradient(900px 480px at 8% 108%,rgba(229,9,20,.05),transparent 60%),var(--bg)}
header{box-shadow:0 2px 16px rgba(0,0,0,.4)}
.logo{text-shadow:0 2px 20px rgba(229,9,20,.3)}
h2::before{content:"";flex:0 0 auto;width:6px;height:.95em;border-radius:4px;background:linear-gradient(180deg,var(--red),#7a0a10);box-shadow:0 0 12px rgba(229,9,20,.45)}
.tile:focus-visible,.tile:hover{transform:scale(1.05);box-shadow:0 0 0 3px var(--red),0 0 30px rgba(229,9,20,.4),0 12px 32px rgba(0,0,0,.6)}
.tile.capt:focus-visible .thumb,.tile.capt:hover .thumb{transform:scale(1.04);box-shadow:0 0 0 3px var(--red),0 0 26px rgba(229,9,20,.4),0 8px 22px rgba(0,0,0,.55)}
.mcard{transition:transform .15s,box-shadow .15s,border-color .15s}
.mcard:focus-visible,.mcard:hover{outline:none;transform:translateY(-3px);border-color:var(--red);box-shadow:0 0 0 2px var(--red),0 0 24px rgba(229,9,20,.35),0 10px 24px rgba(0,0,0,.5)}
.mcard .mst b.live{animation:livePulse 1.6s ease-in-out infinite}
@keyframes livePulse{50%{opacity:.6}}
.hbtn,.fbtn{transition:transform .15s,box-shadow .15s,background .15s,color .15s}
.hbtn:focus-visible,.fbtn:focus-visible{transform:scale(1.05)}
.row{scrollbar-color:#4a272c transparent}
.row::-webkit-scrollbar{height:8px}
.row::-webkit-scrollbar-thumb{background:#4a272c;border-radius:99px}
.row::-webkit-scrollbar-track{background:transparent}
body::-webkit-scrollbar{width:10px}
body::-webkit-scrollbar-thumb{background:#4a272c;border-radius:99px;border:2px solid var(--bg)}
</style>
</head>
<body>
<div id="cine"></div>
<header>
  <div class="logo" dir="ltr" style="text-align:right"><span style="color:#ff8a00">S</span><span style="color:#8b6cff">a</span><span style="color:#f0388c">j</span><span style="color:#8ccb1f">o</span> <b style="color:#1e90ff">T</b><b>V</b></div>
  <button class="hbtn red" data-nav id="addSite">＋<span class="t"> موقع</span></button>
  <button class="hbtn" data-nav id="addCont">▶<span class="t"> تكملة</span></button>
  <button class="hbtn" data-nav id="addRm" hidden>🎮<span class="t"> ريموت</span></button>
  <button class="hbtn" data-nav id="editBtn">✎<span class="t"> تعديل</span></button>
  <button class="hbtn" data-nav id="kidsBtn">🧒<span class="t"> أطفال</span></button>
</header>
<div class="search"><input id="q" type="search" placeholder="🔍 دور في مواقعك وتكملاتك…" data-nav><a id="gq" class="hbtn" target="_blank" rel="noopener" data-nav hidden>🔎 جوجل</a><button class="hbtn" id="gall" data-nav hidden>🔎 كل مواقعي</button></div>
<div id="status"></div>
<main id="main">
  <h2 id="contH">▶ تكملة المشاهدة <small>اللي وقفت عنده</small></h2>
  <div class="row wide" id="contRow"></div>
  <h2 id="visitH" hidden>🕘 آخر ما شاهدت</h2>
  <div class="row" id="visitRow" hidden></div>
  <h2 id="laterH" hidden>⏳ هتفرج عليه بعدين</h2>
  <div class="row wide" id="laterRow" hidden></div>
  <h2 id="trH" hidden>🔥 الجديد والترند <small>عربي</small></h2>
  <div class="row tr" id="trAr" hidden></div>
  <h2 id="trH2" hidden>🔥 الجديد والترند <small>أجنبي</small></h2>
  <div class="row tr" id="trFx" hidden></div>
  <h2>⭐ مواقعي</h2>
  <div id="chips" hidden></div>
  <div class="grid" id="siteGrid"></div>
  <h2 id="mH" hidden>⚽ ماتشات الكورة <small>أهم الماتشات المصرية والعالمية</small></h2>
  <div class="row tr" id="matchRow" hidden></div>
</main>
<footer><button class="hbtn" id="ab" data-nav hidden></button> <button class="hbtn" id="up" data-nav hidden>🔄 تحديث</button> <button class="hbtn" id="bk" data-nav>💾 نسخة احتياطية</button> <button class="hbtn" id="rs" data-nav>📥 استرجاع</button> <button class="hbtn" id="ar" data-nav>🗂 الأرشيف</button> <button class="hbtn" id="st" data-nav>⚙ إعدادات</button><br><button id="ver" data-nav></button></footer>

<div id="ply" hidden><div class="pbar"><span id="plyT"></span><button class="hbtn" id="plyX" data-nav>✕ إغلاق</button></div><video id="plyV" controls autoplay playsinline></video></div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="push"><div class="box" id="pbox"></div></div>
<div id="toast"></div>

<script>
try{if(window.Android&&Android.isPhone&&Android.isPhone())document.documentElement.classList.add('phone')}catch(e){}
const VERSION={n:'١٣٠',date:'٢٨-١١-٢٠٢٦',created:'السبت ٢٨ نوفمبر ٢٠٢٦ – ١٢:٣٠ ص'};
const LS='shashti-v1';
let items=new Map();
let col=null, editMode=false, gfilter='';
const unlocked=new Set();   // locked groups opened during this visit
let DEV='';try{DEV=localStorage.getItem('shashti-dev')||'';if(!DEV){DEV='d'+Math.random().toString(36).slice(2,10);localStorage.setItem('shashti-dev',DEV)}}catch(e){DEV='d'+Math.random().toString(36).slice(2,10)}
let pushSeen=0;try{pushSeen=+localStorage.getItem('shashti-pushseen')||0}catch(e){}
const $=s=>document.querySelector(s);

/* ---------- storage ---------- */
function loadLocal(){try{JSON.parse(localStorage.getItem(LS)||'[]').forEach(o=>o&&o.id&&items.set(o.id,o))}catch(e){}}
let itemsVer=0,sitesVer=-1,sitesCache=[];   // sites() is asked for the same list many times in one render: build it once until items change
function saveLocal(){itemsVer++;try{localStorage.setItem(LS,JSON.stringify([...items.values()]))}catch(e){}}
const chains={};
function cloudWrite(id,fn){
  chains[id]=(chains[id]||Promise.resolve()).then(fn).catch(e=>{
    if(e&&e.code==='quota_exceeded')toast('المساحة السحابية امتلأت — احذف بعض العناصر');
    else if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){col=null;setStatus('الحفظ السحابي غير متاح — الحفظ على هذا الجهاز فقط')}
  });
}
function put(o){items.set(o.id,o);saveLocal();render();if(col){const c=col;cloudWrite(o.id,()=>c.doc(o.id).set(o))}}
function del(id){items.delete(id);saveLocal();render();if(col){const c=col;cloudWrite(id,()=>c.doc(id).delete())}}

async function initCloud(){
  if(!window.claude||!claude.use)return;
  let db,user;
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){return}
  if(!db||!user)return;
  let uid=null;try{uid=await user.id()}catch(e){}
  if(!uid)return;
  const c=db.collection('data/users/'+uid);
  col=c;
  setStatus('جاري المزامنة…');

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sajo|'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const ch of 'sajo|'+t)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16)}}

/* cinematic background: the picture of the tile you are on, blurred behind the page */

    const dt=Date.now()-cineAt;
    if(cineAt&&dt<450){cineT=setTimeout(()=>setCine(img),450-dt);return}   // holding a direction: the backdrop follows at a calm pace, not every hop
    cineAt=Date.now();cine.dataset.cur=img;cine.style.backgroundImage='url("'+img+'")';cine.classList.add('on')}
  else{cine.dataset.cur='';cineT=setTimeout(()=>cine.classList.remove('on'),350)}}

/* ---------- a site that moved: the app saw its address redirect (twice), so its tile follows it ---------- */
function applyRedirects(){try{
  if(!(window.Android&&Android.redirects))return;
  const m=JSON.parse(Android.redirects()||'{}'),moved=[],list=[];
  Object.keys(m).forEach(from=>{const r=m[from];if(!r||!(r.n>=2)||!r.to)return;
    const fh=hostOf(from),swap=u=>{try{const x=new URL(u);if(hostOf(u)!==fh)return u;const t=new URL(r.to);x.protocol=t.protocol;x.host=t.host;return x.href}catch(e){return u}};
    items.forEach(o=>{if((o.kind==='site'||o.kind==='cont')&&hostOf(o.url)===fh){const nu=swap(o.url);if(nu!==o.url){list.push(Object.assign({},o,{url:nu}));if(o.kind==='site'){delete LC[o.id];moved.push(o.name)}}}});
    try{Android.clearRedirect(from)}catch(e){}});
  if(list.length){lcSave();setMany(list);toast('🔄 اتحدّث رابط: '+[...new Set(moved)].join('، '))}
}catch(e){}}
/* ---------- one tile per series ---------- */
function epNum(t){const m=String(t||'').match(/([\d٠-٩]+)\D*$/);return m?m[1]:''}
function seriesName(t){t=String(t||'');const r=t.replace(/[\s\-–—|:،,]*(?:الحلقة|حلقة|episode|ep\.?)?\s*[\d٠-٩]+\D*$/i,'').trim();return r.length>=2?r:t}
// same series = same site + same title apart from the numbers (YouTube videos are never grouped by themselves)
function seriesKey(c){
  if(c.solo)return 'i:'+c.id;
  if(c.sgroup)return 'm:'+c.sgroup;
  const t=String(c.title||'');
  if(!/[\d٠-٩]/.test(t)||vkey(c.url).indexOf('yt:')===0)return 'i:'+c.id;
  return 'a:'+hostOf(c.url)+'|'+t.replace(/[\d٠-٩]+/g,'#').replace(/\s+/g,' ').trim().toLowerCase();

// the continue row is for series and films: a YouTube video only belongs in it when its title says episode
const isYtSong=c=>vkey(c.url).indexOf('yt:')===0&&!/حلق|\bep(?:isode)?\.?\s*\d/i.test(String(c.title||''));

function finishSeries(list){list.forEach(c=>{dismiss(c.url);items.delete(c.id);const h=histOf(c);items.set(h.id,h);if(col){const cc=col;cloudWrite(c.id,()=>cc.doc(c.id).delete());cloudWrite(h.id,()=>cc.doc(h.id).set(h))}});trimHist();saveLocal();render()}

    b.querySelectorAll('[data-mv]').forEach(x=>x.onclick=e=>{e.preventDefault();e.stopPropagation();const m=x.dataset.mv;
      if(m==='ok')endMove();else moveBy(m==='c'?gridCols():m==='-c'?-gridCols():+m)});}
  else b.textContent='↔ حرّك «'+(s.name||'')+'» بالأسهم — OK أو رجوع لما تخلص';

function endMove(){if(!moveId)return 0;moveId=null;const b=$('#moveBar');if(b)b.hidden=true;render();toast('✓ اتحفظ الترتيب');return 1}
window.endMove=endMove;
function moveBy(step){
  const list=sites().slice(),i=list.findIndex(o=>o.id===moveId),j=i+step;
  if(i<0||j<0||j>=list.length)return;
  const [m]=list.splice(i,1);list.splice(j,0,m);
  list.forEach((o,k)=>{if(o.order!==k){const n=Object.assign({},o,{order:k});items.set(n.id,n);if(col){const c=col;cloudWrite(n.id,()=>c.doc(n.id).set(n))}}});
  saveLocal();render();
}
function gridCols(){const ts=[...$('#siteGrid').querySelectorAll('.tile')];if(!ts.length)return 1;const top=ts[0].offsetTop;let n=0;for(const t of ts){if(t.offsetTop!==top)break;n++}return Math.max(1,n)}
window.addEventListener('keydown',e=>{
  if(!moveId||$('#modal').classList.contains('open'))return;
  const k=e.key,rtl=getComputedStyle(document.documentElement).direction==='rtl';
  let st=0;
  if(k==='ArrowLeft')st=rtl?1:-1;else if(k==='ArrowRight')st=rtl?-1:1;
  else if(k==='ArrowUp')st=-gridCols();else if(k==='ArrowDown')st=gridCols();
  else if(isOk(e)||k==='Escape'||k==='Backspace'){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)endMove();return}
  else return;
  e.preventDefault();e.stopImmediatePropagation();moveBy(st);
},true);

// OK on a tile: opens on release (one press); held ~0.6 s opens the tile menu (works even when the box sends no key repeats)
let okTile=null,okTimer=0,okLong=false;
const isOk=e=>e.key==='Enter'||e.keyCode===13||e.keyCode===23;
// while OK is still held after the menu opened, its repeats must not press the menu's first button («افتح»)
let okSwallow=false;

  if(okTile){e.preventDefault();clearTimeout(okTimer);const t=okTile;okTile=null;if(!okLong){const f=document.activeElement,c=t.isConnected?t:(f&&f.classList&&f.classList.contains('tile')?f:(a&&a.classList&&a.classList.contains('tile')?a:null));if(c)c.click()}okLong=false}},true);

/* ---------- remote / keyboard navigation (TV) ---------- */
document.addEventListener('keydown',e=>{
  if($('#push').classList.contains('open')){if(e.key==='Escape'){$('#push').classList.remove('open');return}
    const pe=[...document.querySelectorAll('#pbox [data-nav]')];if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const i=pe.indexOf(document.activeElement);pe[(i+1)%pe.length].focus()}return}
  const open=$('#modal').classList.contains('open');
  if(open&&(e.key==='Escape'||e.key==='GoBack'||e.key==='BrowserBack')){e.preventDefault();closeModal();return}
  const dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  const d=dirs[e.key];if(!d)return;
  const tg=e.target;
  const editing=tg.matches&&((tg.matches('input:not([type=file])')&&!tg.readOnly)||tg.matches('select'));
  if(editing&&d[1]===0)return;
  if(tg.matches&&tg.matches('select')&&d[0]===0&&!e.altKey){/* allow up/down to leave select */}
  const scope=open?'#box [data-nav]':'body > header [data-nav], .search [data-nav], main [data-nav], footer [data-nav]';
  const els=[...document.querySelectorAll(scope)].filter(el=>el.offsetParent!==null);
  if(!els.length)return;
  const cur=document.activeElement;
  if(!els.includes(cur)){e.preventDefault();els[0].focus();return}
  if(open){ // dialogs: strictly top to bottom, in order
    const i=els.indexOf(cur),next=(d[1]>0||d[0]<0)?i+1:i-1;
    e.preventDefault();if(next>=0&&next<els.length){els[next].focus();els[next].scrollIntoView({block:'nearest'})}
    return;
  }
  // main page: fixed rows, top to bottom; right/left move inside a row
  const vis=el=>el&&!el.hidden&&el.offsetParent!==null;
  const rows=[];

    row.hidden=h.hidden=!l.length;if(!l.length)return;

      const t=tileEl({name:x.t,url:x.u,icon:x.i,sub:x.sn,cap:true,menu:()=>tileMenu('trend',{title:x.t,url:x.u,siteId:x.sid,icon:x.i,k:(ov[trKey(x)]||x.k),key:trKey(x)})});

let trLast=0,trFrame=0;
const trHalf=r=>{const f=r.querySelector('.tile:not(.dup)'),d=r.querySelector('.tile.dup');return f&&d?Math.abs(d.offsetLeft-f.offsetLeft):0};
function trPaused(r){return !!(r._h||r._tt||Date.now()-(r._touch||0)<3500||r.contains(document.activeElement)||$('#modal').classList.contains('open')||document.hidden)}
function trTick(ts){
  const dt=Math.min(64,ts-(trLast||ts));trLast=ts;trFrame=(trFrame+1)%15;
  ['#trAr','#trFx','#matchRow'].forEach(id=>{const r=$(id);if(r.hidden||!r._loop)return;
    if(trFrame===0){const b=r.getBoundingClientRect();r._vis=!(b.bottom<0||b.top>innerHeight)}   // the position check runs ~4 times a second, not every frame
    if(r._vis===false||trPaused(r)){r._a=null;return}
    if(r._sg==null)r._sg=getComputedStyle(r).direction==='rtl'?-1:1;
    if(r._a==null)r._a=Math.abs(r.scrollLeft);
    r._a+=TR_SPEED*dt/1000;
    if(r._half==null)r._half=trHalf(r);   // offsetLeft forces a layout: measure once per content, not per frame
    if(r._half>50)r._a%=r._half;
    r.scrollLeft=r._sg*r._a});
  requestAnimationFrame(trTick)}
['#trAr','#trFx','#matchRow'].forEach(id=>{const r=$(id);
